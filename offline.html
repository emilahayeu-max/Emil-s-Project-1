<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Стоя — вы офлайн</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f2ea;
        color: #1f242a;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e2dcce;
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: 0 8px 24px rgba(31, 36, 42, 0.1);
      }
      .mark { font-size: 56px; }
      h1 { font-size: 26px; margin: 16px 0 8px; font-weight: 600; }
      p { color: #5b6470; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.6; }
      blockquote { font-style: italic; color: #8c6a3f; margin: 20px 0 0; }
      button {
        margin-top: 20px;
        background: #a97e4f;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">🏛</div>
      <h1>Вы офлайн</h1>
      <p>
        Соединение с интернетом потеряно. Уже записанные данные в безопасности.
        Проверьте сеть и обновите страницу.
      </p>
      <blockquote>«Не вещи тревожат людей, а их суждения о вещах» — Эпиктет</blockquote>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
